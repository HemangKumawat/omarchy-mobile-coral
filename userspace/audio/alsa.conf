# Direct hardware access only. Channel and physical route selection stay explicit.
# No software mixer, automatic gain changes, resampling, or default-device routing.
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string }
    @args.DEV { type integer }
    @args.SUBDEV { type integer default -1 }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

ctl.hw {
    @args [ CARD ]
    @args.CARD { type string }
    type hw
    card $CARD
}
