# The kernel freezes analogue gain at zero and caps digital gain at -26 dB.
SectionVerb {
	Value { TQ "HiFi" }
	EnableSequence [
		cset "name='Top Digital PCM Volume' 608"
		cset "name='Bottom Digital PCM Volume' 608"
		cset "name='Top Channel Mux' RX1"
		cset "name='Bottom Channel Mux' RX2"
		cset "name='Top AMP Enable Switch' 1"
		cset "name='Bottom AMP Enable Switch' 1"
		cset "name='Top BOOST Enable Switch' 1"
		cset "name='Bottom BOOST Enable Switch' 1"
	]
	DisableSequence [
		cset "name='Top Speaker Switch' 0"
		cset "name='Bottom Speaker Switch' 0"
		cset "name='Top AMP Enable Switch' 0"
		cset "name='Bottom AMP Enable Switch' 0"
		cset "name='Top BOOST Enable Switch' 0"
		cset "name='Bottom BOOST Enable Switch' 0"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer QUAT_TDM_TX_0' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Both speakers at capped gain"
	ConflictingDevice [ "Earpiece" "BottomSpeaker" ]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 100
	}
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Top Speaker Switch' 1"
		cset "name='Bottom Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='Top Speaker Switch' 0"
		cset "name='Bottom Speaker Switch' 0"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Earpiece" {
	Comment "Top speaker and earpiece; left PCM channel"
	ConflictingDevice [ "Speaker" "BottomSpeaker" ]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 200
	}
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Bottom Speaker Switch' 0"
		cset "name='Top Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='Top Speaker Switch' 0"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."BottomSpeaker" {
	Comment "Bottom speaker; right PCM channel"
	ConflictingDevice [ "Speaker" "Earpiece" ]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 50
	}
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Top Speaker Switch' 0"
		cset "name='Bottom Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='Bottom Speaker Switch' 0"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Mic" {
	Comment "IA8508 TDM slots; Rust must boot and configure the DSP first"
	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 4
		CapturePriority 100
	}
	EnableSequence [ cset "name='MultiMedia2 Mixer QUAT_TDM_TX_0' 1" ]
	DisableSequence [ cset "name='MultiMedia2 Mixer QUAT_TDM_TX_0' 0" ]
}
